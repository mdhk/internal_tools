[project]
name = "internal_tools"
version = "0.1.0"
requires-python = ">=3.12.11"
readme = "README.md"
dependencies = [
  "torch>=2.10.0",
  "torchaudio>=2.10.0",
  "transformers>=5.0.0",
  "librosa>=0.11.0",
  "pandas>=2.2.2"
]

[project.optional-dependencies]
dev = [
  "datasets>=4.0.0",
  "torchcodec>=0.10.0",
  "ipykernel>=7.2.0",
  "ipywidgets>=8.1.8",
  "jupyterlab>=4.5.6",
  "seaborn>=0.13.2",
  "gdown>=6.1.0",
]
